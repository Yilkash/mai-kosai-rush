<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#120e0b">
  <meta name="description" content="Mai Kosai Rush: help Lois and Racheal run the kosai stall from 5:30 to 9:30pm.">
  <title>Mai Kosai Rush</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Outfit:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">{ "imports": { "three": "./js/vendor/three.module.min.js" } }</script>
</head>
<body>
  <div id="app"></div>

  <div class="top">
    <div class="badge">Mai Kosai Rush<small>3D look test · not the game yet</small></div>
    <div class="actions">
      <button id="sound" type="button" aria-pressed="false">Sound: off</button>
      <button id="fullscreen" type="button">Full screen</button>
    </div>
  </div>

  <div class="bar">
    <label for="time" id="timeLabel">7:00 pm</label>
    <input id="time" type="range" min="330" max="570" step="1" value="420">
    <button id="play" type="button">Play the evening</button>
    <button id="intro" type="button">Intro</button>
  </div>

  <div class="tip" id="tip" hidden>
    <span>Best played with your phone sideways</span>
    <button id="tipClose" type="button" aria-label="Close tip">✕</button>
  </div>

  <div class="loading" id="loading">Lighting the fire…</div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
