<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#120e0b">
  <meta name="description" content="Mai Kosai Rush: help Lois and Racheal run the kosai stall from 5:30 to 9:30pm.">
  <title>Mai Kosai Rush</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Outfit:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">{ "imports": { "three": "./js/vendor/three.module.min.js" } }</script>
</head>
<body>
  <div id="app"></div>
  <div id="labels"></div>
  <div id="bubbles" aria-live="polite"></div>

  <div class="top">
    <div class="clockbox"><b id="clock">5:30 pm</b><small id="money">₦0 tonight</small></div>
    <div class="target"><small id="targetLabel">Evening 1</small><div class="tbar"><i id="targetFill"></i></div></div>
    <div class="actions">
      <button id="viewBtn" type="button">Stall view</button>
      <button id="sound" type="button" aria-pressed="false">Sound: off</button>
      <button id="pause" type="button">Pause</button>
    </div>
  </div>

  <button id="segun" class="segun" type="button" hidden>Oluwasegun: post on WhatsApp</button>
  <button id="skip" class="skip" type="button" hidden>Skip</button>
  <p id="hint" class="hint" aria-live="polite"></p>

  <div id="serve" class="serve" role="group" aria-label="Serving" hidden></div>
  <div id="decide" class="decide" role="group" aria-live="polite" hidden></div>
  <div id="modal" class="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

  <div class="loading" id="loading">Lighting the fire…</div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
